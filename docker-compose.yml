services:
  postgres:
    image: postgres:16-alpine
    container_name: lighthouse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lighthouse
    volumes:
      - lighthouse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lighthouse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lighthouse_pg_data:
